<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="50" y="55" font-size="30" font-weight="700" fill="#172554">전체 구조: 순수 Python</text>
<text x="50" y="90" font-size="17" fill="#475569">표준 라이브러리 · 읽기 전용 분석 · 기록 속 명령은 실행하지 않음</text>
<rect x="50.0" y="120" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="149" font-size="19" fill="#1d4ed8" font-weight="700">CLI / Tkinter GUI</text>
<text x="68.0" y="177" font-size="16" fill="#334155">main.py / ui/app.py</text>
<text x="68.0" y="200" font-size="16" fill="#334155">출처·기록 트리, 파일 목록·콘텐츠 보기</text>
<rect x="654.0" y="120" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="149" font-size="19" fill="#1d4ed8" font-weight="700">입력 인식과 이미지 읽기</text>
<text x="672.0" y="177" font-size="16" fill="#334155">core/auto_detect.py / image/*</text>
<text x="672.0" y="200" font-size="16" fill="#334155">파일 종류·SID 판별 → NTFS 추출</text>
<rect x="50.0" y="265" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="294" font-size="19" fill="#1d4ed8" font-weight="700">Windows 수집</text>
<text x="68.0" y="322" font-size="16" fill="#334155">collector/windows.py: ctypes → Windows API</text>
<text x="68.0" y="345" font-size="16" fill="#334155">공유 읽기·하이브 저장·이벤트 내보내기</text>
<rect x="654.0" y="265" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="294" font-size="19" fill="#1d4ed8" font-weight="700">형식별 파서</text>
<text x="672.0" y="322" font-size="16" fill="#334155">parser/*: REGF·EVTX·MFT·브라우저 등</text>
<text x="672.0" y="345" font-size="16" fill="#334155">XPRESS Huffman도 Python으로 해제</text>
<rect x="50.0" y="410" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="439" font-size="19" fill="#1d4ed8" font-weight="700">분석 엔진</text>
<text x="68.0" y="467" font-size="16" fill="#334155">pipeline → timeline / enrichment / correlation</text>
<text x="68.0" y="490" font-size="16" fill="#334155">해시·손상 진단·관계 후보 보존</text>
<rect x="654.0" y="410" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="439" font-size="19" fill="#1d4ed8" font-weight="700">저장과 내보내기</text>
<text x="672.0" y="467" font-size="16" fill="#334155">SQLite / HTML / JSON / CSV / Bodyfile</text>
<text x="672.0" y="490" font-size="16" fill="#334155">외부 런타임 패키지·자체 C 빌드 없음</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="50" y="55" font-size="30" font-weight="700" fill="#172554">분석 흐름: 입력에서 결과까지</text>
<text x="50" y="90" font-size="17" fill="#475569">단계 순서: 1 → 2 → 3 → 4 → 5 → 6</text>
<rect x="50.0" y="120" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="149" font-size="19" fill="#1d4ed8" font-weight="700">1. 입력 선택</text>
<text x="68.0" y="177" font-size="16" fill="#334155">--input: 종류 지정 / --auto: 인식 근거 표시</text>
<text x="68.0" y="200" font-size="16" fill="#334155">--image: 이미지 / --live: 관리자 직접 읽기</text>
<rect x="654.0" y="120" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="149" font-size="19" fill="#1d4ed8" font-weight="700">2. 이미지 추출 (해당할 때)</text>
<text x="672.0" y="177" font-size="16" fill="#334155">E01/raw/고정 VHD → 파티션 → NTFS</text>
<text x="672.0" y="200" font-size="16" fill="#334155">ARTIFACT_SPECS, 원본 경로·해시 manifest</text>
<rect x="50.0" y="265" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="294" font-size="19" fill="#1d4ed8" font-weight="700">3. 무결성과 복구</text>
<text x="68.0" y="322" font-size="16" fill="#334155">SHA-256 전후 비교, 원본 읽기 전용</text>
<text x="68.0" y="345" font-size="16" fill="#334155">LOG/WAL은 임시 사본에서만 복구</text>
<rect x="654.0" y="265" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="294" font-size="19" fill="#1d4ed8" font-weight="700">4. 파싱</text>
<text x="672.0" y="322" font-size="16" fill="#334155">parse(path) → ForensicEvent / ParserError</text>
<text x="672.0" y="345" font-size="16" fill="#334155">경계·길이·순환 검사, 손상 뒤에도 계속</text>
<rect x="50.0" y="410" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="439" font-size="19" fill="#1d4ed8" font-weight="700">5. 정렬과 분석</text>
<text x="68.0" y="467" font-size="16" fill="#334155">미상 시각·시간대·SID를 임의로 확정하지 않음</text>
<text x="68.0" y="490" font-size="16" fill="#334155">대량 관계는 후보 수·이벤트 묶음으로 보존</text>
<rect x="654.0" y="410" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="439" font-size="19" fill="#1d4ed8" font-weight="700">6. 결과 저장</text>
<text x="672.0" y="467" font-size="16" fill="#334155">case.sqlite / report.html·json / timeline.*</text>
<text x="672.0" y="490" font-size="16" fill="#334155">GUI: 출처 트리 → 기록 정보 → 콘텐츠</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="50" y="55" font-size="30" font-weight="700" fill="#172554">공통 데이터 모델</text>
<text x="50" y="90" font-size="17" fill="#475569">dataclass는 저장과 화면 표시가 공유하는 계약</text>
<rect x="50.0" y="120" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="149" font-size="19" fill="#1d4ed8" font-weight="700">Evidence</text>
<text x="68.0" y="177" font-size="16" fill="#334155">source / collected / sha256 / method</text>
<text x="68.0" y="200" font-size="16" fill="#334155">collected_at / metadata</text>
<rect x="654.0" y="120" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="149" font-size="19" fill="#1d4ed8" font-weight="700">ForensicEvent</text>
<text x="672.0" y="177" font-size="16" fill="#334155">artifact / source / action / timestamp / time_field</text>
<text x="672.0" y="200" font-size="16" fill="#334155">sid / path / process / url / locator / status / details</text>
<rect x="50.0" y="265" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="294" font-size="19" fill="#1d4ed8" font-weight="700">ParserError</text>
<text x="68.0" y="322" font-size="16" fill="#334155">source / artifact / locator / message / severity</text>
<text x="68.0" y="345" font-size="16" fill="#334155">손상·미지원·정보 진단을 출처와 함께 보존</text>
<rect x="654.0" y="265" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="294" font-size="19" fill="#1d4ed8" font-weight="700">AnalysisResult</text>
<text x="672.0" y="322" font-size="16" fill="#334155">evidence / events / errors / relations</text>
<text x="672.0" y="345" font-size="16" fill="#334155">summaries / profiles / image</text>
<rect x="50.0" y="410" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="68.0" y="439" font-size="19" fill="#1d4ed8" font-weight="700">Parser 계약</text>
<text x="68.0" y="467" font-size="16" fill="#334155">parse(path) → Iterable[ForensicEvent]</text>
<text x="68.0" y="490" font-size="16" fill="#334155">ArtifactParser.error → 진단 누적</text>
<rect x="654.0" y="410" width="576.0" height="120" rx="12" fill="white" stroke="#94a3b8"/>
<text x="672.0" y="439" font-size="19" fill="#1d4ed8" font-weight="700">미상과 후보</text>
<text x="672.0" y="467" font-size="16" fill="#334155">timestamp=None / time_field=None</text>
<text x="672.0" y="490" font-size="16" fill="#334155">관계 후보는 실행·인과 확정을 뜻하지 않음</text>
</svg>

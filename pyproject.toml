[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-hunter"
version = "1.0.0"
description = "Pure Python forensic analysis with standard-library Windows collection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
log-hunter = "log_hunter.main:main"

[tool.setuptools.packages.find]
include = ["log_hunter*"]
